<div class="card p-fluid mb-4">
    <h2>Filtrer les signalements</h2>
    <div class="formgrid grid">
        <div class="field col-3">
            <label for="reasonFilter">Motif</label>
            <p-dropdown
                [options]="reasons"
                [(ngModel)]="reasonFilter"
                optionLabel="label"
            optionValue="code"
            placeholder="Sélectionner un motif"
            inputId="reasonFilter"
            styleClass="w-full"
            ></p-dropdown>
        </div>

        <div class="field col-3">
            <label for="statusFilter">Statut</label>
            <p-dropdown
                [options]="statuses"
                [(ngModel)]="statusFilter"
                optionLabel="label"
            optionValue="code"
            placeholder="Sélectionner un statut"
            inputId="statusFilter"
            styleClass="w-full"
            ></p-dropdown>
        </div>

        <div class="field col-3">
            <label for="startDateFilter">Date début</label>
            <input id="startDateFilter" type="date" pInputText [(ngModel)]="startDateFilter" class="w-full" />
        </div>

        <div class="field col-3">
            <label for="endDateFilter">Date fin</label>
            <input id="endDateFilter" type="date" pInputText [(ngModel)]="endDateFilter" class="w-full" />
        </div>
        <div class="mt-4 pt-1 col-3 col-offset-6">
            <button pButton type="button" label="Appliquer les filtres" icon="pi pi-filter" (click)="applyFilters()"></button>
        </div>
        <div class="mt-4 pt-1 col-3">
            <button pButton type="button" label="Réinitialiser" icon="pi pi-refresh" class="p-button-secondary ml-2" (click)="resetFilters()"></button>
        </div>
    </div>
</div>

<div class="card">
    <h2>Liste des signalements</h2>
    <p-table
        [value]="filteredReports"
        [paginator]="true"
        [rows]="rows"
        [first]="first"
        [showCurrentPageReport]="true"
        [tableStyle]="{ 'min-width': '60rem' }"
        currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} rapports"
        (onPage)="pageChange($event)"
        [rowsPerPageOptions]="[5, 10, 25, 50]"
    >
        <ng-template pTemplate="header">
            <tr>
                <th>Motif</th>
                <th>Expéditeur</th>
                <th>Utilisateur signalé</th>
                <th>Statut</th>
                <th>Date</th>
                <th>Actions</th>

            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-report>
            <tr>
                <td>{{ report.reason | reportReasonLabel }}</td>
                <td>{{ report.reporterEmail }}</td>
                <td>{{ report.reportedUserEmail }}</td>
                <td>
                    <p-tag [severity]="report.open ? 'success' : 'danger'" [value]="report.open ? 'Ouvert' : 'Fermé'"></p-tag>
                </td>
                <td>{{ report.reportDate | date:'dd/MM/yyyy' }}</td>
                <td>
                    <button
                        pButton
                        type="button"
                        icon="pi pi-ban"
                        class="p-button-danger p-button-sm"
                        label="Bloquer"
                        (click)="blockUser(report.reportedUserId, report.id)"
                    ></button>
                </td>

            </tr>
        </ng-template>
    </p-table>
</div>
