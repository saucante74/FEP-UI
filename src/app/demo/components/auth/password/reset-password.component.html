<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">Réinitialiser le mot de passe</div>
                    <p class="text-600">Saisissez votre adresse email pour recevoir un lien de réinitialisation.</p>
                </div>

                <form (ngSubmit)="onSubmit()" #resetForm="ngForm" class="w-full md:w-30rem">
                    <label for="email" class="block text-900 font-medium text-xl mb-2">Email</label>
                    <input id="email"
                           name="email"
                           [(ngModel)]="email"
                           type="email"
                           placeholder="Votre adresse email"
                           required
                           pInputText
                           class="w-full mb-5 p-3" />

                    <div *ngIf="error" class="text-red-500 mb-3">{{ error }}</div>
                    <div *ngIf="success" class="text-green-600 mb-3">{{ success }}</div>

                    <button type="submit" pButton pRipple label="Envoyer le lien" class="w-full p-3 text-xl"></button>
                </form>
            </div>
        </div>
    </div>
</div>
