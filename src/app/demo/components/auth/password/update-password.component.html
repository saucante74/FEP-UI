<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">Nouveau mot de passe</div>
                    <p class="text-600">Saisissez votre nouveau mot de passe pour réinitialiser votre compte.</p>
                </div>

                <form (ngSubmit)="onSubmit()" #updateForm="ngForm" class="w-full md:w-30rem">
                    <label for="newPassword" class="block text-900 font-medium text-xl mb-2">Nouveau mot de passe</label>
                    <p-password id="newPassword"
                                [(ngModel)]="newPassword"
                                name="newPassword"
                                [toggleMask]="true"
                                required
                                styleClass="w-full mb-5"
                                inputStyleClass="w-full p-3"></p-password>

                    <label for="confirmPassword" class="block text-900 font-medium text-xl mb-2">Confirmer le mot de passe</label>
                    <p-password id="confirmPassword"
                                [(ngModel)]="confirmPassword"
                                name="confirmPassword"
                                [toggleMask]="true"
                                required
                                styleClass="w-full mb-5"
                                inputStyleClass="w-full p-3"></p-password>

                    <div *ngIf="error" class="text-red-500 mb-3">{{ error }}</div>
                    <div *ngIf="success" class="text-green-600 mb-3">{{ success }}</div>

                    <button type="submit" pButton pRipple label="Mettre à jour" class="w-full p-3 text-xl"></button>
                </form>
            </div>
        </div>
    </div>
</div>
