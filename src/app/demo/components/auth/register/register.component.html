<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <img src="assets/layout/images/{{layoutService.config().colorScheme === 'light' ? 'logo-dark' : 'logo-white'}}.svg" alt="Sakai logo" class="mb-5 w-6rem flex-shrink-0">
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">Inscription</div>
                    <span class="text-600 font-medium">Créez votre compte pour continuer</span>
                </div>

                <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
                    <label for="username" class="block text-900 text-l font-medium mb-2">Nom d'utilisateur</label>
                    <input id="username" name="username" [(ngModel)]="formData.username" type="text" pInputText class="w-full mb-5" style="padding:1rem">

                    <label for="email" class="block text-900 text-l font-medium mb-2">Email</label>
                    <input id="email" name="email" [(ngModel)]="formData.email" type="email" pInputText class="w-full mb-5" style="padding:1rem">

                    <label for="lastname" class="block text-900 text-l font-medium mb-2">Nom</label>
                    <input id="lastname" name="lastname" [(ngModel)]="formData.lastname" type="text" pInputText class="w-full mb-5" style="padding:1rem">

                    <label for="firstname" class="block text-900 text-l font-medium mb-2">Prénom</label>
                    <input id="firstname" name="firstname" [(ngModel)]="formData.firstname" type="text" pInputText class="w-full mb-5" style="padding:1rem">

                    <label for="password" class="block text-900 font-medium text-l mb-2">Mot de passe</label>
                    <p-password id="password" name="password" [(ngModel)]="formData.password" placeholder="Mot de passe" [toggleMask]="true" styleClass="mb-5" inputStyleClass="w-full p-3 md:w-30rem"></p-password>

                    <label for="role" class="block text-900 text-l font-medium mb-2">Rôle</label>
                    <p-dropdown [options]="roles" [(ngModel)]="formData.role" name="role" optionLabel="label" optionValue="value" class="w-full mb-5"></p-dropdown>
                    <br><br>
                    <button type="submit" pButton pRipple label="S'inscrire" class="w-full p-3 text-xl"></button>
                </form>

            </div>
        </div>
    </div>
</div>
