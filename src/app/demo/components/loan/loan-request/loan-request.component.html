<div class="card p-fluid">
    <h2>Créer un prêt</h2>

    <div class="formgrid grid">
        <div class="field col-4">
            <label for="amount">Montant</label>
            <input id="amount" type="number" pInputText [(ngModel)]="loan.amount" />
        </div>

        <div class="field col-4">
            <label for="interestRate">Taux d'intérêt (%)</label>
            <input id="interestRate" type="number" pInputText [(ngModel)]="loan.interestRate" />
        </div>

        <div class="field col-4">
            <label for="duration">Durée (mois)</label>
            <input id="duration" type="number" pInputText [(ngModel)]="loan.durationInMonths" />
        </div>
    </div>

    <div class="mt-3 field col-6 col-offset-3">
        <button pButton type="button" label="Créer le prêt" (click)="submitLoan()"></button>
    </div>
</div>
