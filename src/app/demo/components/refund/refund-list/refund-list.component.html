<div class="card p-fluid mb-4">
    <h2>Mes remboursements</h2>
    <div class="formgrid grid">
        <div class="field col-6">
            <label for="loanReferenceFilter">Référence du prêt</label>
            <input id="loanReferenceFilter" type="text" pInputText [(ngModel)]="loanReferenceFilter" />
        </div>

        <div class="field col-6">
            <label for="statusFilter">Statut</label>
            <p-dropdown
                [options]="statuses"
                [(ngModel)]="statusFilter"
                optionLabel="name"
                optionValue="code"
                placeholder="Sélectionner un statut"
                inputId="statusFilter"
            ></p-dropdown>
        </div>

        <div class="mt-4 pt-1 col-3 col-offset-6">
            <button pButton type="button" label="Appliquer les filtres" icon="pi pi-filter" (click)="applyFilters()"></button>
        </div>
        <div class="mt-4 pt-1 col-3">
            <button pButton type="button" label="Réinitialiser" icon="pi pi-refresh" class="p-button-secondary ml-2" (click)="resetFilters()"></button>
        </div>
    </div>
</div>

<div class="card">
    <h2>Liste des remboursements</h2>
    <p-table
        [value]="filteredRefunds"
        [paginator]="true"
        [rows]="rows"
        [first]="first"
        [showCurrentPageReport]="true"
        [tableStyle]="{ 'min-width': '50rem' }"
        currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} remboursements"
        (onPage)="pageChange($event)"
        [rowsPerPageOptions]="[5, 10, 25, 50]"
    >
        <ng-template pTemplate="header">
            <tr>
                <th>Référence du prêt</th>
                <th>Montant</th>
                <th>Date de remboursement</th>
                <th>Statut</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-refund>
            <tr>
                <td>{{ refund.loanReference }}</td>
                <td>{{ refund.amount | currency:'EUR' }}</td>
                <td>{{ refund.refundDate | date:'dd/MM/yyyy' }}</td>
                <td>{{ refund.status | refundStatusLabel }}</td>
            </tr>
        </ng-template>
    </p-table>
</div>
