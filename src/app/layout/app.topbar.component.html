<div class="layout-topbar">
    <a class="layout-topbar-logo" routerLink="">
        <span>FEP - Finance Entre Particulier</span>
    </a>

    <a #menubutton class="p-link layout-menu-button layout-topbar-button" (click)="layoutService.onMenuToggle()">
        <i class="pi" [ngClass]="layoutService.isMenuOpen ? 'pi-angle-right' : 'pi-angle-left'"></i>
    </a>

    <button #topbarmenubutton class="p-link layout-topbar-menu-button layout-topbar-button" (click)="layoutService.showProfileSidebar()">
        <i class="pi pi-ellipsis-v"></i>
    </button>

    <div #topbarmenu class="layout-topbar-menu" [ngClass]="{'layout-topbar-menu-mobile-active': layoutService.state.profileSidebarVisible}">
        <button class="p-link" [routerLink]="'/documentation'">
            <span class="text-primary-700">{{ userInfo.role | roleLabel }} : {{ userInfo.firstName }} {{ userInfo.lastName }}</span>
        </button>
        <a class="p-link layout-topbar-button" (click)="this.toggleDarkMode()">
            <i class="pi" [class.pi-moon]="!isDarkMode" [class.pi-sun]="isDarkMode"></i>
            <span>Dark Mode</span>
        </a>
    </div>
</div>
